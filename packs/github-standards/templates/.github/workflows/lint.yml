name: Lint
on: [pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx eslint . --max-warnings 0
      - run: npx stylelint "**/*.css" --allow-empty-input
      - run: npx prettier --check .
